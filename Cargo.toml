[workspace]
resolver = "2"
members = [
  "crates/lumen-types",
  "crates/lumen-config",
  "crates/lumen-platform",
  "crates/lumen-platform-macos",
  "crates/lumen-cua",
  "crates/lumen-intake",
  "crates/lumen-sources-media",
  "crates/lumen-sources-browser",
  "crates/lumen-store",
  "crates/lumen-process",
  "crates/lumen-api",
  "crates/lumen-daemon",
  "apps/desktop/src-tauri",
]
default-members = [
  "crates/lumen-types",
  "crates/lumen-config",
  "crates/lumen-platform",
  "crates/lumen-platform-macos",
  "crates/lumen-intake",
  "crates/lumen-sources-media",
  "crates/lumen-sources-browser",
  "crates/lumen-store",
  "crates/lumen-process",
  "crates/lumen-api",
  "crates/lumen-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Chris"]
repository = "https://github.com/fakechris/lumen-navi"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
blake3 = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
cpal = "0.15"
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal", "net"] }
toml = { version = "0.8", features = ["parse", "display"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
ureq = { version = "2", default-features = true, features = ["json"] }

lumen-types = { path = "crates/lumen-types" }
lumen-config = { path = "crates/lumen-config" }
lumen-platform = { path = "crates/lumen-platform" }
lumen-platform-macos = { path = "crates/lumen-platform-macos" }
lumen-cua = { path = "crates/lumen-cua" }
# Shared Lumen product-cluster crates (lumen-suite). `cloud` enables the
# OpenAI-compatible HTTP engine navi has always shipped. Keep all lumen-suite
# deps on a single rev.
lumen-asr-engine = { git = "https://github.com/fakechris/lumen-suite.git", rev = "ef449465d18865d3d819309a64b1e723ae329817", features = ["cloud"] }
lumen-models = { git = "https://github.com/fakechris/lumen-suite.git", rev = "ef449465d18865d3d819309a64b1e723ae329817" }
lumen-transcript = { git = "https://github.com/fakechris/lumen-suite.git", rev = "ef449465d18865d3d819309a64b1e723ae329817" }
lumen-intake = { path = "crates/lumen-intake" }
lumen-sources-media = { path = "crates/lumen-sources-media" }
lumen-sources-browser = { path = "crates/lumen-sources-browser" }
lumen-store = { path = "crates/lumen-store" }
lumen-process = { path = "crates/lumen-process" }
lumen-api = { path = "crates/lumen-api" }
