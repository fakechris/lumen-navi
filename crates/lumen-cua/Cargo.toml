[package]
name = "lumen-cua"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local capability service and IPC client for Lumen screen capture"
repository.workspace = true

[[bin]]
name = "lumen-cua"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
lumen-platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
lumen-platform-macos = { workspace = true }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSError"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "SCShareableContent",
    "SCScreenshotManager",
    "SCStream",
    "block2",
    "objc2-core-graphics",
] }
objc2-core-graphics = "0.3.2"
block2 = "0.6"
core-foundation = "0.10"
libc = "0.2"
security-framework = "3.7"

[dev-dependencies]
tempfile = "3"
