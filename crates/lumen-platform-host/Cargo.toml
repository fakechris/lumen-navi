[package]
name = "lumen-platform-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Selects the lumen-platform backend for the build target"

[dependencies]
lumen-platform = { workspace = true }
lumen-platform-cpal = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
lumen-platform-macos = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
lumen-platform-windows = { workspace = true }
