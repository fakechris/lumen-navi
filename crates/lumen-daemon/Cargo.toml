[package]
name = "lumen-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Long-running local daemon for Lumen Navi intake"
repository.workspace = true

[[bin]]
name = "lumen-daemon"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
lumen-api = { workspace = true }
lumen-asr-engine = { workspace = true }
lumen-config = { workspace = true }
lumen-cua = { workspace = true }
lumen-models = { workspace = true }
lumen-intake = { workspace = true }
lumen-platform = { workspace = true }
lumen-platform-host = { workspace = true }
lumen-process = { workspace = true }
lumen-sources-media = { workspace = true }
lumen-sources-browser = { workspace = true }
lumen-store = { workspace = true }
lumen-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
lumen-platform-macos = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
